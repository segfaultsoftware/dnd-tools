services:
  web:
    build:
      context: .
    user: "0:0"
    restart: unless-stopped
    expose:
      - "80"
    networks:
      web:
        aliases:
          - dnd-tools-web
      internal:
    volumes:
      - ./storage:/rails/storage
    secrets:
      - source: rails_master_key
        target: rails_master_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    environment:
      RAILS_MASTER_KEY_FILE: /run/secrets/rails_master_key
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --header "Host: dnd-tools.home.arpa"
          http://127.0.0.1/up || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  web:
    external: true
  internal:
    internal: true

secrets:
  rails_master_key:
    file: ${RAILS_MASTER_KEY_FILE:?RAILS_MASTER_KEY_FILE must be set in .env.deploy}
